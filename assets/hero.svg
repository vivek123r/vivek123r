      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.6s" begin="2.7s" fill="freeze" additive="sum"/>
    </g>
  </g>

  <!-- Availability badge -->
  <g opacity="0">
    <rect x="535" y="322" width="210" height="28" rx="14" fill="#ffd98e" fill-opacity="0.08" stroke="#ffd98e" stroke-opacity="0.45"/>
    <circle cx="553" cy="336" r="4.5" fill="#ffd98e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="647" y="340" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1.5" fill="#ffe9b0">OPEN TO OPPORTUNITIES</text>
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="3s" fill="freeze"/>
  </g>

  <!-- Waves: one morphing, one static -->
  <path d="M0,364 Q200,350 400,364 T800,364 T1280,364 L1280,400 L0,400 Z" fill="#ffd6e7" opacity="0.04"/>
  <path d="M0,356 Q160,338 320,356 T640,356 T960,356 T1280,356 L1280,400 L0,400 Z" fill="#ff9ec7" opacity="0.05">
    <animate attributeName="d" values="M0,356 Q160,338 320,356 T640,356 T960,356 T1280,356 L1280,400 L0,400 Z;M0,356 Q160,366 320,356 T640,356 T960,356 T1280,356 L1280,400 L0,400 Z;M0,356 Q160,338 320,356 T640,356 T960,356 T1280,356 L1280,400 L0,400 Z" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- Falling petals: sway baked into fall path (2 anims per petal instead of 3) -->
  <g>
    <g transform="translate(110,-25)" opacity="0.8">
      <g><animateTransform attributeName="transform" type="translate" values="0 0;20 95;-14 195;18 300;-10 400;4 480" keyTimes="0;0.18;0.38;0.58;0.8;1" dur="13s" begin="-2s" repeatCount="indefinite"/>
        <use href="#petalShape" xlink:href="#petalShape" fill="url(#pg1)" transform="scale(1.2)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite" additive="sum"/>
        </use>
      </g>
    </g>
    <g transform="translate(260,-25)" opacity="0.65">
      <g><animateTransform attributeName="transform" type="translate" values="0 0;-18 90;14 190;-12 300;6 480" keyTimes="0;0.22;0.46;0.72;1" dur="16s" begin="-9s" repeatCount="indefinite"/>
        <use href="#petalShape" xlink:href="#petalShape" fill="url(#pg2)" transform="scale(0.9)">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite" additive="sum"/>
        </use>
      </g>
    </g>
    <g transform="translate(410,-25)" opacity="0.85">
      <g><animateTransform attributeName="transform" type="translate" values="0 0;20 100;-16 205;16 315;0 480" keyTimes="0;0.18;0.4;0.64;1" dur="12s" begin="-5s" repeatCount="indefinite"/>
        <use href="#petalShape" xlink:href="#petalShape" fill="url(#pg1)" transform="scale(1.1)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" additive="sum"/>
        </use>
      </g>
    </g>
    <g transform="translate(560,-25)" opacity="0.75">
      <g><animateTransform attributeName="transform" type="translate" values="0 0;24 105;-12 210;20 330;6 490" keyTimes="0;0.18;0.4;0.66;1" dur="11s" begin="-3s" repeatCount="indefinite"/>
        <use href="#petalShape" xlink:href="#petalShape" fill="url(#pg1)" transform="scale(1.3)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.6s" repeatCount="indefinite" additive="sum"/>
        </use>
      </g>
    </g>
    <g transform="translate(700,-25)" opacity="0.7">
      <g><animateTransform attributeName="transform" type="translate" values="0 0;-20 95;16 200;-16 320;2 480" keyTimes="0;0.2;0.44;0.7;1" dur="14s" begin="-8s" repeatCount="indefinite"/>
        <use href="#petalShape" xlink:href="#petalShape" fill="url(#pg2)" transform="scale(0.9)">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6.8s" repeatCount="indefinite" additive="sum"/>
        </use>
      </g>
    </g>
    <g transform="translate(850,-25)" opacity="0.8">
      <g><animateTransform attributeName="transform" type="translate" values="0 0;18 100;-14 205;18 320;8 480" keyTimes="0;0.18;0.4;0.64;1" dur="12.5s" begin="-1s" repeatCount="indefinite"/>
        <use href="#petalShape" xlink:href="#petalShape" fill="url(#pg1)" transform="scale(1.15)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.2s" repeatCount="indefinite" additive="sum"/>
        </use>
      </g>
    </g>
    <g transform="translate(1000,-25)" opacity="0.85">
      <g><animateTransform attributeName="transform" type="translate" values="0 0;22 105;-16 210;18 330;0 490" keyTimes="0;0.18;0.4;0.66;1" dur="10.5s" begin="-6s" repeatCount="indefinite"/>
        <use href="#petalShape" xlink:href="#petalShape" fill="url(#pg1)" transform="scale(1.25)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.8s" repeatCount="indefinite" additive="sum"/>
        </use>
      </g>
    </g>
    <g transform="translate(1130,-25)" opacity="0.7">
      <g><animateTransform attributeName="transform" type="translate" values="0 0;-18 96;14 198;-14 312;6 480" keyTimes="0;0.2;0.44;0.7;1" dur="13.5s" begin="-14s" repeatCount="indefinite"/>
        <use href="#petalShape" xlink:href="#petalShape" fill="url(#pg2)" transform="scale(1)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6.2s" repeatCount="indefinite" additive="sum"/>
        </use>
      </g>
    </g>
    <g transform="translate(1235,-25)" opacity="0.65">
      <g><animateTransform attributeName="transform" type="translate" values="0 0;-16 98;14 202;-12 315;2 480" keyTimes="0;0.2;0.44;0.7;1" dur="15s" begin="-4s" repeatCount="indefinite"/>
        <use href="#petalShape" xlink:href="#petalShape" fill="url(#pg2)" transform="scale(0.9)">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6.6s" repeatCount="indefinite" additive="sum"/>
        </use>
      </g>
    </g>
    <g transform="translate(640,-25)" opacity="0.5">
      <g><animateTransform attributeName="transform" type="translate" values="0 0;16 108;-12 218;14 340;4 500" keyTimes="0;0.18;0.42;0.68;1" dur="17s" begin="-7s" repeatCount="indefinite"/>
        <use href="#petalShape" xlink:href="#petalShape" fill="url(#pg2)" transform="scale(0.7)">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite" additive="sum"/>
        </use>
      </g>
    </g>
  </g>

</g>

<!-- Frame border -->
<rect x="1" y="1" width="1278" height="398" rx="24" fill="none" stroke="#ff9ec7" stroke-opacity="0.16" stroke-width="1.2"/>
</svg>
