<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Vivek R - Full Stack and AI Engineer, Sakura Nightfall edition">
<defs>
  <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#120a26"/>
    <stop offset="55%" stop-color="#381646"/>
    <stop offset="100%" stop-color="#581f5b"/>
  </linearGradient>

  <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="30%" stop-color="#ffd6e7"/>
    <stop offset="50%" stop-color="#ff9ec7"/>
    <stop offset="70%" stop-color="#ffd6e7"/>
    <stop offset="100%" stop-color="#ffffff"/>
  </linearGradient>

  <linearGradient id="underlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff8fb7" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ff9ec7"/>
    <stop offset="100%" stop-color="#ff8fb7" stop-opacity="0"/>
  </linearGradient>

  <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffe9b8" stop-opacity="0.45"/>
    <stop offset="45%" stop-color="#ff9ec7" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#ff9ec7" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="titleAura" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff8fb7" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#ff8fb7" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="mistGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="pg1" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffd6e7"/>
    <stop offset="100%" stop-color="#ff7ea8"/>
  </linearGradient>
  <linearGradient id="pg2" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffeef6"/>
    <stop offset="100%" stop-color="#ff9ec7"/>
  </linearGradient>

  <clipPath id="frameClip">
    <rect x="0" y="0" width="1280" height="400" rx="24"/>
  </clipPath>

  <path id="petalShape" d="M0,-7 C4.5,-5 6,-1 4.5,3 C3,6.5 -3,6.5 -4.5,3 C-6,-1 -4.5,-5 0,-7 Z"/>
</defs>

<g clip-path="url(#frameClip)">

  <!-- Night sky -->
  <rect width="1280" height="400" fill="url(#sky)"/>

  <!-- Kanji watermark -->
  <text x="1136" y="252" font-family="'Yu Mincho','Hiragino Mincho ProN',serif" font-size="240" fill="#ffb7d9" opacity="0.05" text-anchor="middle">桜</text>
  <text x="96" y="352" font-family="'Yu Mincho','Hiragino Mincho ProN',serif" font-size="130" fill="#ffb7d9" opacity="0.04" text-anchor="middle">夢</text>

  <!-- Stars: few twinkle, rest static -->
  <g fill="#ffeef6">
    <circle cx="205" cy="88" r="0.9" opacity="0.35"/>
    <circle cx="320" cy="42" r="1.3" opacity="0.7"/>
    <circle cx="440" cy="70" r="1" opacity="0.4"/>
    <circle cx="668" cy="92" r="0.9" opacity="0.35"/>
    <circle cx="872" cy="80" r="1" opacity="0.45"/>
    <circle cx="1215" cy="60" r="1.2" opacity="0.65"/>
    <circle cx="1250" cy="140" r="0.9" opacity="0.35"/>
    <circle cx="150" cy="150" r="0.8" opacity="0.3"/>
    <circle cx="520" cy="128" r="0.9" opacity="0.32"/>
    <circle cx="90" cy="52" r="1.2"><animate attributeName="opacity" values="0.9;0.15;0.9" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="555" cy="36" r="1.2"><animate attributeName="opacity" values="0.8;0.18;0.8" dur="3.1s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="775" cy="48" r="1.1"><animate attributeName="opacity" values="0.75;0.15;0.75" dur="2.8s" begin="-0.6s" repeatCount="indefinite"/></circle>
    <circle cx="905" cy="34" r="1.1"><animate attributeName="opacity" values="0.8;0.16;0.8" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="104" r="1"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.4s" begin="-1.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Moon -->
  <g transform="translate(1015,108)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="8s" repeatCount="indefinite"/>
      <circle r="125" fill="url(#moonGlow)"/>
    </g>
    <circle r="56" fill="#ffedc6"/>
    <g fill="#eed9a4" opacity="0.55">
      <circle cx="-14" cy="-10" r="9"/>
      <circle cx="16" cy="8" r="6"/>
      <circle cx="-2" cy="22" r="4.5"/>
      <circle cx="22" cy="-20" r="3.5"/>
    </g>
  </g>

  <!-- Drifting mist -->
  <ellipse cx="360" cy="212" rx="330" ry="26" fill="url(#mistGrad)">
    <animateTransform attributeName="transform" type="translate" values="0 0;60 0;0 0" dur="22s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="900" cy="188" rx="280" ry="22" fill="url(#mistGrad)" opacity="0.8"/>

  <!-- Far ridge -->
  <path d="M0,262 Q140,238 260,256 T520,250 T780,258 T1040,244 L1280,256 L1280,400 L0,400 Z" fill="#2b1646" opacity="0.95"/>

  <!-- Fuji + snow cap -->
  <path d="M900,300 C960,238 1000,204 1035,186 C1070,206 1112,242 1172,300 Z" fill="#241337"/>
  <path d="M1035,186 C1052,196 1064,208 1073,222 L1060,217 L1052,230 L1040,219 L1028,232 L1018,218 L1005,225 C1016,206 1026,194 1035,186 Z" fill="#ffeaf3" opacity="0.95"/>

  <!-- Near ridge -->
  <path d="M0,306 Q180,282 360,300 T720,294 T1080,304 L1280,296 L1280,400 L0,400 Z" fill="#1a0e30"/>

  <!-- Ground -->
  <rect x="0" y="344" width="1280" height="56" fill="#11081f"/>

  <!-- Sakura branch, top-left -->
  <g transform="translate(-12,58)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-0.8;0.8;-0.8" dur="10s" repeatCount="indefinite"/>
      <g transform="translate(12,-58)">
        <g stroke="#170d29" fill="none" stroke-linecap="round">
          <path d="M-12,58 C130,40 260,52 356,92 C430,122 486,158 520,196" stroke-width="16"/>
          <path d="M300,72 C330,58 358,54 386,62" stroke-width="8"/>
          <path d="M392,116 C420,106 446,108 468,120" stroke-width="7"/>
          <path d="M210,54 C232,42 258,38 282,44" stroke-width="7"/>
        </g>
        <g transform="translate(520,196)"><g>
          <animateTransform attributeName="transform" type="rotate" values="-2.5;2.5;-2.5" dur="5.2s" begin="-1.2s" repeatCount="indefinite"/>
          <circle r="13" fill="#ff9ec7"/><circle cx="-14" cy="6" r="11" fill="#ff7ea8"/><circle cx="14" cy="8" r="11" fill="#ffc2da"/><circle cy="17" r="10" fill="#ff8fb7"/><circle cx="-9" cy="-12" r="9" fill="#ffd9ea"/><circle cx="11" cy="-9" r="9" fill="#ff9ec7"/>
        </g></g>
        <g transform="translate(386,62)"><g>
          <animateTransform attributeName="transform" type="rotate" values="2.2;-2.2;2.2" dur="5.8s" begin="-0.6s" repeatCount="indefinite"/>
          <circle r="11" fill="#ffc2da"/><circle cx="-12" cy="5" r="9" fill="#ff9ec7"/><circle cx="12" cy="6" r="9" fill="#ff7ea8"/><circle cy="-10" r="8" fill="#ffd9ea"/>
        </g></g>
        <g transform="translate(468,120)"><g>
          <animateTransform attributeName="transform" type="rotate" values="-2;2;-2" dur="5.4s" begin="-2.1s" repeatCount="indefinite"/>
          <circle r="10" fill="#ff8fb7"/><circle cx="-11" cy="5" r="8" fill="#ffc2da"/><circle cx="11" cy="5" r="8" fill="#ff9ec7"/>
        </g></g>
        <g transform="translate(282,44)"><g>
          <animateTransform attributeName="transform" type="rotate" values="1.8;-1.8;1.8" dur="4.9s" begin="-1.7s" repeatCount="indefinite"/>
          <circle r="9" fill="#ff9ec7"/><circle cx="-10" cy="4" r="7" fill="#ffd9ea"/><circle cx="10" cy="4" r="7" fill="#ff7ea8"/>
        </g></g>
        <g transform="translate(356,92)"><g>
          <animateTransform attributeName="transform" type="rotate" values="-1.6;1.6;-1.6" dur="6.2s" begin="-0.2s" repeatCount="indefinite"/>
          <circle r="9" fill="#ffc2da"/><circle cx="10" cy="4" r="7" fill="#ff9ec7"/><circle cx="-10" cy="3" r="7" fill="#ff8fb7"/>
        </g></g>
        <circle cx="332" cy="63" r="4" fill="#ff7ea8"/>
        <circle cx="430" cy="110" r="3.6" fill="#ff9ec7"/>
        <circle cx="244" cy="43" r="3.4" fill="#ffc2da"/>
      </g>
    </g>
  </g>

  <!-- Vertical さくら -->
  <g font-family="'Yu Mincho','Hiragino Mincho ProN',serif" font-size="17" fill="#ff9ec7" opacity="0.55" text-anchor="middle">
    <text x="40" y="248">さ</text>
    <text x="40" y="274">く</text>
    <text x="40" y="300">ら</text>
  </g>

  <!-- Title aura (gradient, no filter) -->
  <ellipse cx="640" cy="130" rx="360" ry="70" fill="url(#titleAura)"/>

  <!-- Title block -->
  <g text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="640" y="86" font-size="15" letter-spacing="8" fill="#ffb7d9" opacity="0">ようこそ
      <animate attributeName="opacity" values="0;0.85" dur="1s" begin="0.3s" fill="freeze"/>
    </text>
    <text x="640" y="152" font-size="82" font-weight="800" letter-spacing="10" fill="url(#titleGrad)" opacity="0">VIVEK R
      <animate attributeName="opacity" values="0;1" dur="1.1s" begin="0.15s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 0" dur="1.1s" begin="0.15s" fill="freeze" additive="sum"/>
    </text>
    <rect x="530" y="170" width="220" height="3" rx="1.5" fill="url(#underlineGrad)" opacity="0">
      <animate attributeName="width" values="0;220" dur="0.9s" begin="1s" fill="freeze"/>
      <animate attributeName="x" values="640;530" dur="0.9s" begin="1s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1s" fill="freeze"/>
    </rect>
    <text x="640" y="206" font-size="17" font-weight="600" letter-spacing="5" fill="#f6d3e6" opacity="0">FULL-STACK • AI AGENTS • CLOUD NATIVE
      <animate attributeName="opacity" values="0;1" dur="1s" begin="1.25s" fill="freeze"/>
    </text>
    <text x="640" y="234" font-size="13.5" letter-spacing="1" fill="#cfa9dd" opacity="0">production-grade agent pipelines • sub-200ms realtime • cloud-native scale
      <animate attributeName="opacity" values="0;0.95" dur="1s" begin="1.6s" fill="freeze"/>
    </text>
  </g>

  <!-- Tech pills -->
  <g font-family="'Fira Code',Consolas,monospace" font-size="12.5" font-weight="600" text-anchor="middle">
    <g opacity="0">
      <rect x="308" y="264" width="128" height="32" rx="16" fill="#ff9ec7" fill-opacity="0.10" stroke="#ff9ec7" stroke-opacity="0.32"/>
      <text x="372" y="284" fill="#ffdcea">⚛️ React / Next</text>
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.6s" begin="1.9s" fill="freeze" additive="sum"/>
    </g>
    <g opacity="0">
      <rect x="450" y="264" width="126" height="32" rx="16" fill="#ff9ec7" fill-opacity="0.10" stroke="#ff9ec7" stroke-opacity="0.32"/>
      <text x="513" y="284" fill="#ffdcea">🤖 LangGraph</text>
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.6s" begin="2.1s" fill="freeze" additive="sum"/>
    </g>
    <g opacity="0">
      <rect x="590" y="264" width="108" height="32" rx="16" fill="#ff9ec7" fill-opacity="0.22" stroke="#ff9ec7" stroke-opacity="0.5"/>
      <text x="644" y="284" fill="#fff0f7">⚡ Flutter</text>
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.6s" begin="2.3s" fill="freeze" additive="sum"/>
    </g>
    <g opacity="0">
      <rect x="712" y="264" width="98" height="32" rx="16" fill="#ff9ec7" fill-opacity="0.10" stroke="#ff9ec7" stroke-opacity="0.32"/>
      <text x="761" y="284" fill="#ffdcea">☁️ AWS</text>
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.6s" begin="2.5s" fill="freeze" additive="sum"/>
    </g>
    <g opacity="0">
      <rect x="824" y="264" width="148" height="32" rx="16" fill="#ff9ec7" fill-opacity="0.10" stroke="#ff9ec7" stroke-opacity="0.32"/>
