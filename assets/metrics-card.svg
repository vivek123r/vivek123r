<svg width="1280" height="120" viewBox="0 0 1280 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Cards row - 4 metrics -->
  <g font-family="'Fira Code', monospace">
    <!-- Card 1 -->
    <rect x="10" y="10" width="300" height="95" rx="14" fill="url(#cardBg)" stroke="white" stroke-opacity="0.07"/>
    <rect x="10" y="10" width="300" height="1.5" rx="1" fill="url(#highlight)"/>
    <text x="160" y="38" text-anchor="middle" font-size="28" font-weight="800" fill="white">8</text>
    <text x="160" y="58" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.2">AI AGENTS ORCHESTRATED</text>
    <text x="160" y="78" text-anchor="middle" font-size="10" fill="#22d3ee" letter-spacing="0.5">LangGraph • Concurrent</text>
    <!-- Card 2 -->
    <rect x="333" y="10" width="300" height="95" rx="14" fill="url(#cardBg)" stroke="white" stroke-opacity="0.07"/>
    <rect x="333" y="10" width="300" height="1.5" rx="1" fill="url(#highlight)"/>
    <text x="483" y="38" text-anchor="middle" font-size="28" font-weight="800" fill="white">15-20s</text>
    <text x="483" y="58" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.2">AVG QUERY TIME</text>
    <text x="483" y="78" text-anchor="middle" font-size="10" fill="#22d3ee" letter-spacing="0.5">100+ SSE Events</text>
    <!-- Card 3 -->
    <rect x="656" y="10" width="300" height="95" rx="14" fill="url(#cardBg)" stroke="white" stroke-opacity="0.07"/>
    <rect x="656" y="10" width="300" height="1.5" rx="1" fill="url(#highlight)"/>
    <text x="806" y="38" text-anchor="middle" font-size="28" font-weight="800" fill="white">&lt;200ms</text>
    <text x="806" y="58" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.2">REALTIME LATENCY</text>
    <text x="806" y="78" text-anchor="middle" font-size="10" fill="#22d3ee" letter-spacing="0.5">WebSockets • Flutter</text>
    <!-- Card 4 -->
    <rect x="979" y="10" width="290" height="95" rx="14" fill="url(#cardBg)" stroke="#10b981" stroke-opacity="0.18"/>
    <rect x="979" y="10" width="290" height="1.5" rx="1" fill="#10b981" fill-opacity="0.5"/>
    <text x="1124" y="38" text-anchor="middle" font-size="28" font-weight="800" fill="white">99.9%</text>
    <text x="1124" y="58" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.2">UPTIME ACHIEVED</text>
    <text x="1124" y="78" text-anchor="middle" font-size="10" fill="#10b981" letter-spacing="0.5">AWS • CloudWatch</text>
    <circle cx="1125" cy="88" r="2.5" fill="#10b981"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>