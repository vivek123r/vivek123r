<svg width="1280" height="70" viewBox="0 0 1280 70" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
  <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff8fb7" stop-opacity="0"/>
    <stop offset="18%" stop-color="#ff8fb7" stop-opacity="0.55"/>
    <stop offset="42%" stop-color="#ffb7d9" stop-opacity="0.9"/>
    <stop offset="50%" stop-color="#ffd6e7"/>
    <stop offset="58%" stop-color="#ffb7d9" stop-opacity="0.9"/>
    <stop offset="82%" stop-color="#ff8fb7" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#ff8fb7" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="dpg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffd6e7"/>
    <stop offset="100%" stop-color="#ff7ea8"/>
  </linearGradient>
  <path id="dpetal" d="M0,-7 C4.5,-5 6,-1 4.5,3 C3,6.5 -3,6.5 -4.5,3 C-6,-1 -4.5,-5 0,-7 Z"/>
</defs>

<!-- line -->
<rect x="0" y="34.2" width="1280" height="1.6" rx="0.8" fill="url(#lineGrad)"/>

<!-- side ornaments -->
<g fill="#ff9ec7">
  <rect x="497" y="32" width="6" height="6" transform="rotate(45 500 35)" opacity="0.6"/>
  <rect x="777" y="32" width="6" height="6" transform="rotate(45 780 35)" opacity="0.6"/>
  <circle cx="430" cy="35" r="2" opacity="0.4"/>
  <circle cx="850" cy="35" r="2" opacity="0.4"/>
</g>

<!-- center blossom -->
<g transform="translate(640,35)">
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.1s" fill="freeze"/>
    <g>
      <g>
        <animateTransform attributeName="transform" type="scale" values="0;1.18;1" dur="0.8s" begin="0.1s" fill="freeze"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="9s" begin="-2s" repeatCount="indefinite"/>
          <g fill="url(#dpg)" stroke="#e75480" stroke-opacity="0.35" stroke-width="0.6">
            <ellipse cx="0" cy="-11" rx="6" ry="11"/>
            <ellipse cx="0" cy="-11" rx="6" ry="11" transform="rotate(72)"/>
            <ellipse cx="0" cy="-11" rx="6" ry="11" transform="rotate(144)"/>
            <ellipse cx="0" cy="-11" rx="6" ry="11" transform="rotate(216)"/>
            <ellipse cx="0" cy="-11" rx="6" ry="11" transform="rotate(288)"/>
          </g>
          <circle r="4.2" fill="#ffd166" stroke="#e75480" stroke-width="0.8"/>
          <g fill="#e75480">
            <circle cx="0" cy="-6.5" r="1.1"/>
            <circle cx="6.2" cy="-2" r="1.1"/>
            <circle cx="3.8" cy="5.2" r="1.1"/>
            <circle cx="-3.8" cy="5.2" r="1.1"/>
            <circle cx="-6.2" cy="-2" r="1.1"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</g>

<!-- drifting petals -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.06;0.94;1" dur="10s" repeatCount="indefinite"/>
  <g>
    <animateMotion path="M -30,35 q 90,-16 180,0 t 180,0 t 180,0 t 180,0 t 180,0 t 180,0 t 180,0" dur="10s" repeatCount="indefinite"/>
    <use href="#dpetal" xlink:href="#dpetal" fill="url(#dpg)" transform="scale(1.3)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
</g>
<g opacity="0">
  <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.06;0.94;1" dur="10s" begin="-5s" repeatCount="indefinite"/>
  <g>
    <animateMotion path="M -30,35 q 90,14 180,0 t 180,0 t 180,0 t 180,0 t 180,0 t 180,0 t 180,0" dur="10s" begin="-5s" repeatCount="indefinite"/>
    <use href="#dpetal" xlink:href="#dpetal" fill="url(#dpg)" transform="scale(1)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="3.6s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
</g>
</svg>
